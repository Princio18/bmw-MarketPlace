<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your admin verification code</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f2f2f2;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f2f2f2;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width: 600px; max-width: 100%; background-color: #ffffff; margin: 24px 0;">
          <tr>
            <td style="padding: 40px 48px; font-family: Arial, Helvetica, sans-serif; color: #1a1a1a;">
              <h1 style="margin: 0 0 24px 0; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: bold; color: #1a1a1a;">
                YOUR ADMIN VERIFICATION CODE.
              </h1>

              <p style="margin: 0 0 12px 0; font-size: 14px; line-height: 20px;">
                Hello,
              </p>

              <p style="margin: 0 0 24px 0; font-size: 14px; line-height: 20px;">
                Use the code below to finish signing in to your BMW Marketplace
                admin dashboard:
              </p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin: 0 0 24px 0;">
                <tr>
                  <td align="center" style="background-color: #f7f7f7; border: 1px solid #e5e5e5; border-radius: 6px; padding: 20px 0;">
                    <span style="font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: bold; color: #1a1a1a; letter-spacing: 8px;">
                      {{code}}
                    </span>
                  </td>
                </tr>
              </table>

              <p style="margin: 0 0 24px 0; font-size: 14px; line-height: 20px; color: #555555;">
                This code expires in 10 minutes. If you didn't request this,
                you can safely ignore this email.
              </p>

              <p style="margin: 0 0 8px 0; font-size: 14px; line-height: 20px;">
                Best regards,
              </p>
              <p style="margin: 0 0 24px 0; font-size: 14px; line-height: 20px; font-weight: bold;">
                Your BMW ID team
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
