<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your BMW Marketplace Refund</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f2f2f2;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f2f2f2;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width: 600px; max-width: 100%; background-color: #ffffff; margin: 24px 0;">
          <tr>
            <td style="padding: 40px 48px; font-family: Arial, Helvetica, sans-serif; color: #1a1a1a;">
              <h1 style="margin: 0 0 24px 0; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: bold; color: #1a1a1a;">
                YOUR REFUND HAS BEEN INITIATED.
              </h1>

              <p style="margin: 0 0 20px 0; font-size: 14px; line-height: 20px;">
                Hello {{firstName}},
              </p>

              <p style="margin: 0 0 20px 0; font-size: 14px; line-height: 20px;">
                Your refund of <strong>{{amount}}</strong> has been initiated. It
                usually appears on your statement within 5&ndash;10 business days,
                depending on your bank.
              </p>

              <p style="margin: 0 0 0 0; font-size: 14px; line-height: 20px;">
                Best regards,<br />
                <strong>Your BMW Marketplace team</strong>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
